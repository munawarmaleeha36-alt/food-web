<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - FoodieHub</title>
    <link rel="stylesheet" href="static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">FoodieHub</div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="categories.html">Categories</a></li>
                    <li><a href="deals.html">Deals</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="signup.html">Sign Up</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-btn">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Your Cart</h1>
            <p>Review your selected items and proceed to checkout</p>
        </div>
    </section>

    <section class="cart-section">
        <div class="container">
            <div id="cart-items" class="cart-items">
                <!-- Cart items will be populated by JavaScript -->
            </div>
            <div id="cart-total" class="cart-total">
                <!-- Total will be displayed here -->
            </div>
            <div class="cart-actions">
                <button class="cta-button" id="checkout-btn">Proceed to Checkout</button>
                <a href="index.html" class="secondary-button">Continue Shopping</a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>FoodieHub</h4>
                    <p>Delivering deliciousness to your doorstep.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="deals.html">Deals</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Follow Us</h4>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="static/script.js"></script>
    <script>
        // Load cart items on page load
        document.addEventListener('DOMContentLoaded', async function() {
            const cartData = await getCart();
            if (cartData) {
                displayCart(cartData);
            }
        });

        function displayCart(data) {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            cartItemsDiv.innerHTML = '';
            cartTotalDiv.innerHTML = '';

            if (data.items.length === 0) {
                cartItemsDiv.innerHTML = '<p>Your cart is empty.</p>';
                return;
            }

            data.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <img src="https://images.unsplash.com/photo-${getImageForItem(item.id)}?w=100&h=100&fit=crop" alt="${item.name}">
                    <div class="item-details">
                        <h4>${item.name}</h4>
                        <p>$${item.price.toFixed(2)} x ${item.quantity}</p>
                        <p>Total: $${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                    <button class="remove-btn" data-item-id="${item.id}">Remove</button>
                `;
                cartItemsDiv.appendChild(itemDiv);
            });

            cartTotalDiv.innerHTML = `<h3>Total: $${data.total.toFixed(2)}</h3>`;

            // Add event listeners for remove buttons
            document.querySelectorAll('.remove-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const itemId = this.dataset.itemId;
                    removeFromCart(itemId);
                });
            });
        }

        function getImageForItem(itemId) {
            const images = {
                1: '1568901346375-23c9450c58cd',
                4: '1546069901-ba9599a7e63c',
                5: '1565299507177-b0ac66763828',
                6: '1551024506-0bccd828d307'
            };
            return images[itemId] || '1568901346375-23c9450c58cd';
        }

        // Checkout functionality (placeholder)
        document.getElementById('checkout-btn').addEventListener('click', function() {
            alert('Checkout functionality to be implemented');
        });
    </script>
</body>
</html>
